[package]
name = "hk-parser"
version = "0.3.2"
authors = ["HackerOS Team <hackeros068@gmail.com>"]
edition = "2021"
license = "MIT"
description = "A robust parser and serializer for HackerOS configuration files (.hk)."
readme = "README.md"
repository = "https://github.com/HackerOS-Linux-System/hk-parser.git"
keywords = ["parser", "configuration", "hk-format", "hackeros"]
categories = ["parser-implementations", "config"]

[dependencies]
indexmap = "2.14.0"
thiserror = "2.0.18"
regex = "1.13.1"
lazy_static = "1.5.0"
colored = "3.1.1"
clap = { version = "4.6.2", features = ["derive"] }
anyhow = "1.0.103"

# Lua bindings (LuaRocks module) — opt-in, see `[features]` and `luarocks/`.
mlua = { version = "0.12", optional = true, default-features = false }

[features]
default = []
# Native Lua module (`require "hk_parser_core"`). Pick exactly ONE Lua flavour
# below; `luarocks-build-rust-mlua` selects it automatically from the Lua
# version LuaRocks runs under.
lua     = ["dep:mlua", "mlua/module"]
lua51   = ["lua", "mlua/lua51"]
lua52   = ["lua", "mlua/lua52"]
lua53   = ["lua", "mlua/lua53"]
lua54   = ["lua", "mlua/lua54"]
lua55   = ["lua", "mlua/lua55"]
luajit  = ["lua", "mlua/luajit"]
luajit52 = ["lua", "mlua/luajit52"]

[dev-dependencies]
pretty_assertions = "1.4.1"

[lib]
name = "hk_parser"
path = "src/lib.rs"
# `cdylib` produces libhk_parser.so — the C ABI from `src/ffi.rs` and, with a
# `lua5x`/`luajit` feature, the native Lua module (see `luarocks/`).
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "hk-parser"
path = "main.rs"
