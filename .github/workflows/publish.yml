name: publish

# Reczne publikowanie: Actions -> publish -> "Run workflow".
#   target:  all | crates | luarocks
#   dry_run: true  (domyslnie) = sprawdza wszystko, ale NIC nie publikuje
#
# Wymagane sekrety repozytorium (Settings -> Secrets and variables -> Actions):
#   CARGO_REGISTRY_TOKEN   token z https://crates.io/settings/tokens   (crates.io)
#   LUAROCKS_API_KEY       klucz z https://luarocks.org/settings/api-keys (LuaRocks)
#
# Wersja pochodzi z Cargo.toml. Dla LuaRocks musi istniec
# luarocks/hk-parser-<wersja>-1.rockspec ORAZ tag git v<wersja> (rockspec wydania
# pobiera zrodla z tagu) - workflow to sprawdza przed publikacja.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Gdzie publikowac"
        type: choice
        options:
          - all
          - crates
          - luarocks
        default: all
      dry_run:
        description: "Tylko sprawdz (nic nie publikuj)"
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Wspolna bramka: testy Rusta + testy Lua, zanim cokolwiek wyjdzie na swiat.
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Wersja z Cargo.toml
        id: v
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ -n "$version" ] || { echo "::error::nie znaleziono version w Cargo.toml"; exit 1; }
          echo "version=$version" | tee -a "$GITHUB_OUTPUT"
      - name: Testy Rusta
        run: cargo test --release
      - name: Testy Lua (5.4)
        run: |
          sudo apt-get update && sudo apt-get install -y lua5.4
          cargo build --release --lib --features lua54
          mkdir -p dist/lua
          cp target/release/libhk_parser.so dist/lua/hk_parser_core.so
          LUA_PATH='luarocks/lua/?.lua' LUA_CPATH='dist/lua/?.so' lua5.4 luarocks/test/run.lua

  crates:
    needs: verify
    if: inputs.target == 'all' || inputs.target == 'crates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            cargo publish --dry-run
          else
            [ -n "$CARGO_REGISTRY_TOKEN" ] || { echo "::error::brak sekretu CARGO_REGISTRY_TOKEN"; exit 1; }
            cargo publish
          fi

  luarocks:
    needs: verify
    if: inputs.target == 'all' || inputs.target == 'luarocks'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      DRY_RUN: ${{ inputs.dry_run }}
      LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Zainstaluj luarocks
        run: sudo apt-get update && sudo apt-get install -y luarocks
      - name: Sprawdz rockspec i tag
        run: |
          rockspec="luarocks/hk-parser-${VERSION}-1.rockspec"
          [ -f "$rockspec" ] || { echo "::error::brak $rockspec (wersja z Cargo.toml: $VERSION)"; exit 1; }
          luarocks lint "$rockspec"
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null; then
            echo "tag v${VERSION} istnieje"
          elif [ "$DRY_RUN" = "true" ]; then
            echo "::warning::tag v${VERSION} nie istnieje - realna publikacja by sie nie udala"
          else
            echo "::error::tag v${VERSION} nie istnieje (git tag v${VERSION} && git push --tags)"
            exit 1
          fi
      - name: Sprawdz, ze paczka sie buduje (make + test)
        run: |
          luarocks --local install luarocks-build-rust-mlua
          luarocks --local make luarocks/hk-parser-scm-1.rockspec
          luarocks --local test luarocks/hk-parser-scm-1.rockspec
      - name: luarocks upload
        if: inputs.dry_run != true
        run: |
          [ -n "$LUAROCKS_API_KEY" ] || { echo "::error::brak sekretu LUAROCKS_API_KEY"; exit 1; }
          luarocks upload "luarocks/hk-parser-${VERSION}-1.rockspec" --api-key="$LUAROCKS_API_KEY"
